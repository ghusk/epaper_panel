; PlatformIO project for CrowPanel ESP32-S3-WROOM-1-N8R8 5.79" e-paper clock/weather panel

[env:crowpanel-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; N8R8 = 8MB Quad flash, 8MB Octal PSRAM
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
